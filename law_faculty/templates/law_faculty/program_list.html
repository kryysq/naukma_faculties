{% extends "base.html" %}

{% block title %}Освітні програми - Факультет правничих наук{% endblock %}

{% block content %}
    <h1>Освітні програми</h1>
    <ul>
        {% for program in programs %}
            <li>
                <a href="{% url 'program_detail' program.id %}">{{ program.name }}</a>
            </li>
        {% empty %}
            <li>Поки що немає доступних програм.</li>
        {% endfor %}
    </ul>
{% endblock %}
